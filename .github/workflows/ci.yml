name: CI

# Verifies the project actually installs, compiles and passes its tests.
# This matters because the environment the rewrite was authored in had no
# access to the npm registry, so `yarn install` never ran there and the React
# Native screens were never type-checked against real dependencies.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (this project uses Yarn 4)
        run: corepack enable

      - name: Install dependencies
        # --no-immutable because yarn.lock is stale after the dependency prune
        # and needs regenerating. Once it is committed, drop this flag so CI
        # fails on an out-of-date lockfile instead of silently rewriting it.
        run: yarn install --no-immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Bundle the app for Android
        # Typecheck proves the code compiles; it does not prove Metro can
        # assemble the app. The dependency prune removed expo-linking, a
        # required peer of expo-router. Typecheck passed, and the app then
        # failed on a real phone with "Unable to resolve module expo-linking".
        # This runs the same bundler the phone uses, so that class of failure
        # breaks CI instead of reaching a device.
        run: yarn expo export --platform android --output-dir dist
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Tests
        run: yarn test

      - name: Backtest smoke test
        # Runs on the bundled synthetic series. Proves the harness executes
        # end to end; says nothing about strategy performance.
        run: yarn backtest

      - name: Show lockfile diff if it changed
        if: always()
        run: git diff --stat yarn.lock || true

      # The lockfile in the repo is stale after the dependency prune. Upload
      # the regenerated one so it can be committed; once it is, drop
      # --no-immutable above so CI fails on drift instead of papering over it.
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarn-lock
          path: yarn.lock
          retention-days: 7
