name: Sync lockfile

# Regenerates yarn.lock from package.json and commits it if it changed.
#
# Run this after any dependency change. It exists because a lockfile that
# drifts from package.json is worse than useless: CI has to run with
# --no-immutable to tolerate it, which means CI stops verifying that the
# dependency set is reproducible at all.
#
# Trigger from the Actions tab. Kept separate from CI on purpose: a workflow
# that verifies should not also mutate the branch it is verifying.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Regenerate lockfile
        run: yarn install --no-immutable

      - name: Commit if it changed
        run: |
          if git diff --quiet yarn.lock; then
            echo "Lockfile already up to date; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "Regenerate yarn.lock after the dependency prune

          Generated by the sync-lockfile workflow. The committed lockfile had
          drifted from package.json, which forced CI to run with
          --no-immutable and stopped it verifying reproducibility."
          git push
          echo "Lockfile updated and pushed."
